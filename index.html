<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AZYL.ai — Safe harbor for AI risk.</title>
<meta name="description" content="AZYL.ai — Safe harbor for AI risk."/>
<meta name="theme-color" content="#1A1917"/>
<link rel="icon" href="favicon.ico" sizes="any"/>
<link rel="icon" href="favicon.svg" type="image/svg+xml"/>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400&family=Inter:wght@100;200;300;400&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:      #1A1917;
    --blue:    #DCFF2E;
    --silver:  #D6D2CA;
    --ghost:   #F3F1EC;
    --rule:    #282623;
    --dim:     #4A4741;
    --muted:   #6E6A63;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--ghost);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    height: 100vh;
    display: grid;
    grid-template-rows: 64px 1fr 52px;
    padding: 0 52px;
  }

  /* ── NAV ── */
  nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--rule);
  }
  .nav-domain {
    font-size: 10px;
    font-weight: 300;
    letter-spacing: 3px;
    color: var(--dim);
    text-transform: uppercase;
  }
  .nav-cta {
    font-size: 10px;
    font-weight: 300;
    letter-spacing: 2px;
    color: var(--muted);
    text-decoration: none;
    text-transform: uppercase;
    transition: color 0.3s;
    padding-bottom: 1px;
    border-bottom: 1px solid transparent;
  }
  .nav-cta:hover {
    color: var(--silver);
    border-bottom-color: var(--dim);
  }

  /* ── HERO ── */
  .hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    gap: 0;
  }

  .logo-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
    position: relative;
    z-index: 1;
    opacity: 0;
    transform: translateY(16px);
    animation: fadeUp 1.1s cubic-bezier(0.16,1,0.3,1) 0.3s forwards;
  }
  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }

  /* Arc draws in cleanly */
  .arc-path {
    stroke-dasharray: 220;
    stroke-dashoffset: 220;
    animation: drawArc 1.4s cubic-bezier(0.16,1,0.3,1) 0.7s forwards;
  }
  @keyframes drawArc {
    to { stroke-dashoffset: 0; }
  }
  .arc-dot {
    filter: drop-shadow(0 0 5px rgba(220,255,46,0.45));
    opacity: 0;
    transform-origin: center;
    transform: scale(0);
    animation: dotPop 0.5s cubic-bezier(0.34,1.56,0.64,1) 1.9s forwards;
  }
  @keyframes dotPop {
    to { opacity: 1; transform: scale(1); }
  }

  /* ── WORDMARK ── */
  .wordmark-row {
    display: flex;
    align-items: baseline;
  }
  .wordmark-azyl {
    font-size: 58px;
    font-weight: 100;
    letter-spacing: 16px;
    color: var(--ghost);
    line-height: 1;
    font-family: 'Inter', sans-serif;
  }
  .wordmark-ai {
    font-size: 26px;
    font-weight: 200;
    color: var(--blue);
    letter-spacing: 0;
    margin-left: 2px;
  }

  /* ── TAGLINE ── */
  .tagline-wrap {
    min-height: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }
  .tagline-text {
    font-family: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
    font-weight: 300;
    font-size: 14px;
    letter-spacing: 1px;
    color: var(--silver);
    opacity: 0.85;
    white-space: pre;
  }
  .tagline-text .ch { visibility: hidden; }
  .tagline-text .ch.on { visibility: visible; }
  /* a character mid-decode flickers in lime before settling */
  .tagline-text .ch.scr { visibility: visible; color: var(--blue); }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  /* ── FOOTER — ghost email only ── */
  footer {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .footer-email {
    font-size: 10px;
    font-weight: 300;
    letter-spacing: 2.5px;
    color: var(--rule);
    text-transform: uppercase;
    text-decoration: none;
    transition: color 0.4s;
  }
  .footer-email:hover {
    color: var(--dim);
  }

  @media (prefers-reduced-motion: reduce) {
    .logo-wrap, .tagline-wrap, .arc-path, .arc-dot {
      animation-duration: 0.01s !important;
      animation-delay: 0s !important;
    }
  }

  @media (max-width: 600px) {
    .page { padding: 0 28px; }
    .wordmark-azyl { font-size: 40px; letter-spacing: 10px; }
    .wordmark-ai { font-size: 20px; }
    .tagline-text { font-size: 12px; letter-spacing: 0.5px; }
  }
</style>
</head>
<body>
<div class="page">

  <nav>
    <span class="nav-domain">azyl.ai</span>
    <a href="mailto:INFO@AZYL.AI" class="nav-cta">Get in touch</a>
  </nav>

  <main class="hero">

    <div class="logo-wrap">

      <!-- Harbor Arc — arc draws in, dot pops -->
      <svg viewBox="0 0 120 82" width="120" height="82" aria-label="Azyl harbor arc">
        <path class="arc-path"
          d="M10,70 A56,56 0 0,1 110,70"
          fill="none"
          stroke="#D6D2CA"
          stroke-width="2.5"
          stroke-linecap="round"/>
        <circle class="arc-dot" cx="60" cy="70" r="5.5" fill="#DCFF2E"/>
      </svg>

      <div class="wordmark-row">
        <span class="wordmark-azyl">AZYL</span><span class="wordmark-ai">.ai</span>
      </div>

      <div class="tagline-wrap">
        <span class="tagline-text" aria-hidden="true"></span>
        <span class="sr-only" id="tagline-sr">Safe harbor for AI risk.</span>
      </div>

    </div>
  </main>

  <footer>
    <a href="mailto:INFO@AZYL.AI" class="footer-email">INFO@AZYL.AI</a>
  </footer>

</div>

<script>
  (function () {
    var lines = [
      "Safe harbor for AI risk.",
      "Democratized AI.",
      "Centralized AI governance."
    ];
    var GLYPHS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#%&*+=/<>";
    var el = document.querySelector(".tagline-text");
    var sr = document.getElementById("tagline-sr");
    var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
    function rand(s) { return s[Math.floor(Math.random() * s.length)]; }
    function shuffled(a) {
      a = a.slice();
      for (var i = a.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t;
      }
      return a;
    }

    // lay out every character up front (hidden), so the line never shifts while it decodes
    function build(text) {
      el.innerHTML = "";
      var spans = [];
      for (var i = 0; i < text.length; i++) {
        var s = document.createElement("span");
        s.className = "ch";
        s.textContent = text[i];
        el.appendChild(s);
        spans.push(s);
      }
      return spans;
    }

    // letters appear in random order; each flickers through a few lime glyphs, then settles
    function decode(text) {
      var spans = build(text);
      var idx = [];
      for (var i = 0; i < text.length; i++) if (text[i] !== " ") idx.push(i);
      var order = shuffled(idx);
      var step = 1000 / order.length;
      var jobs = order.map(function (i, k) {
        return wait(k * step + Math.random() * 60).then(function () {
          var s = spans[i], n = 3 + Math.floor(Math.random() * 3), c = 0;
          s.classList.add("scr");
          return new Promise(function (done) {
            var t = setInterval(function () {
              if (c++ < n) { s.textContent = rand(GLYPHS); return; }
              clearInterval(t);
              s.textContent = text[i];
              s.classList.remove("scr");
              s.classList.add("on");
              done();
            }, 45);
          });
        });
      });
      return Promise.all(jobs);
    }

    // letters vanish in random order
    function erase() {
      var spans = [].slice.call(el.querySelectorAll(".ch.on"));
      var order = shuffled(spans);
      var step = 450 / Math.max(order.length, 1);
      return Promise.all(order.map(function (s, k) {
        return wait(k * step).then(function () { s.classList.remove("on"); });
      }));
    }

    if (reduced) {
      build(lines[0]).forEach(function (s) { s.classList.add("on"); });
      return;
    }

    (async function loop() {
      await wait(2300); // let the arc draw and the dot drop first
      var i = 0;
      while (true) {
        sr.textContent = lines[i];
        await decode(lines[i]);
        await wait(4500);
        await erase();
        await wait(350);
        i = (i + 1) % lines.length;
      }
    })();
  })();
</script>
</body>
</html>
